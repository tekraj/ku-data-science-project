services:
  db:
      image: postgres:15
      container_name: nepse-postgres-db
      restart: unless-stopped
      environment:
        POSTGRES_DB: ${POSTGRES_DB:-nepse}
        POSTGRES_USER: ${POSTGRES_USER:-superset}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-superset_pass}
        TZ: Asia/Kathmandu
        PGTZ: Asia/Kathmandu
      ports:
        - 5432:5432
      volumes:
        - postgres_data:/var/lib/postgresql/data
        - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      networks:
        - nepse-network

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api-service
    networks:
      - nepse-network

  api-service:
    build:
      context: .
      dockerfile: api-service/Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      TZ: Asia/Kathmandu
    networks:
      - nepse-network
    depends_on:
      - db

  scraper-service:
    build:
      context: .
      dockerfile: scraper-service/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Kathmandu
      TEMPORAL_ADDRESS: temporal:7233
    volumes:
      - ./logs:/app/logs
    networks:
      - nepse-network
    depends_on:
      - db
      - temporal

  temporal:
    image: temporalio/auto-setup:1.24.2
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-superset}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-superset_pass}
      POSTGRES_SEEDS: db
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    ports:
      - "7233:7233"
    networks:
      - nepse-network
    depends_on:
      - db

  temporal-ui:
    image: temporalio/ui:2.31.2
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    networks:
      - nepse-network
    depends_on:
      - temporal

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/pgsql

networks:
 nepse-network:
    driver: bridge
