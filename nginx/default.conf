server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS resolver. Combined with a variable in proxy_pass
    # below, this makes nginx re-resolve api-service on every request instead
    # of caching its IP once at startup -- without it, restarting api-service
    # alone (its container gets a new IP) leaves nginx stuck proxying to the
    # old, now-dead address until nginx itself is restarted (502 Bad Gateway).
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $api_upstream api-service:8001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html has no content-hash in its filename (unlike /assets/*.js,
    # which vite fingerprints), so it's the one file where a stale browser
    # cache actually matters: without an explicit no-cache directive here,
    # browsers apply heuristic caching based on Last-Modified and can keep
    # serving an old index.html (pointing at old, no-longer-served asset
    # hashes) well after a fresh deploy -- confirmed as the actual cause of
    # a user seeing stale dashboard behavior after a real, verified-correct
    # redeploy. The fingerprinted assets themselves are safe to cache
    # indefinitely since a code change always produces a new filename.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
